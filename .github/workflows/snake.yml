name: generate animation

on:
  # roda sozinho a cada 24 horas
  schedule:
    - cron: "0 */24 * * *"

  # permite rodar manualmente pela aba Actions
  workflow_dispatch:

  # roda a cada push na branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_dot_border=#d0d7de
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#21262d,#0e4429,#006d32,#26a641,#39d353&color_dot_border=#30363d

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
